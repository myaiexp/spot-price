# Pörssisähkö static SPA — installed as location /porssi in
# /etc/nginx/sites-enabled/default. This file is the reviewable source of
# truth; live nginx is edited to match (finding #7954).
#
# A location with its own add_header inherits NONE from server level (nginx
# add_header is all-or-nothing per context), so the site-wide security headers
# are re-listed here plus a porssi-scoped CSP. Chart.js + the annotation plugin
# come from jsDelivr (SRI-pinned in index.html); Google Fonts and the
# server-level CF beacon are the other third-party loads. script-src omits
# 'unsafe-inline' because index.html loads js/main.js as type=module.
# style-src-attr allows heatmap/hero/chart CSSOM (cell colours, tooltip coords,
# display toggles) without opening style-src-elem to injected <style> tags.
location /porssi {
    alias /var/www/html/porssi;
    try_files $uri $uri/ /porssi/index.html;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
}
