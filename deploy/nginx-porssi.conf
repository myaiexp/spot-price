# Pörssisähkö nginx locations — the static SPA (location /porssi) and the API
# proxy (location /porssi/api/), both installed in the server block of
# /etc/nginx/sites-enabled/default. This file is the reviewable source of
# truth; live nginx is edited to match (finding #7954, finding #9954).
#
# A location with its own add_header inherits NONE from server level (nginx
# add_header is all-or-nothing per context), so the site-wide security headers
# are re-listed here plus a porssi-scoped CSP. Chart.js + the annotation plugin
# come from jsDelivr (SRI-pinned in index.html); Google Fonts and the
# server-level CF beacon are the other third-party loads. script-src omits
# 'unsafe-inline' because index.html loads js/main.js as type=module.
# style-src-attr allows heatmap/hero/chart CSSOM (cell colours, tooltip coords,
# display toggles) without opening style-src-elem to injected <style> tags.
location /porssi {
    alias /var/www/html/porssi;
    try_files $uri $uri/ /porssi/index.html;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
}

# Pörssisähkö API proxy. Longest-prefix match picks this over location /porssi,
# so API paths never reach its try_files SPA fallback (which would answer a JSON
# request with index.html). The trailing slash on both sides strips the prefix:
# /porssi/api/prices/today → http://127.0.0.1:3600/api/prices/today.
# zone=api is a limit_req_zone declared at http level (nginx.conf), not here.
location /porssi/api/ {
    limit_req zone=api burst=10 nodelay;
    proxy_pass http://127.0.0.1:3600/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Any add_header here drops server-level inheritance (nginx all-or-nothing).
    # Re-list only headers the app does NOT already set via hono/secure-headers,
    # so we don't double X-Frame-Options / Referrer-Policy / X-XSS-Protection.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
}
