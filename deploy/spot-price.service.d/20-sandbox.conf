[Service]
# Sandbox drop-in. MemoryMax is 4x the measured cgroup peak, raised to the next
# of 512M, 1G, 2G, 4G. No MemoryDenyWriteExecute: Node's JIT needs W^X.
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=tmpfs
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
CapabilityBoundingSet=
# Link-local only. A wider private-range deny stays green on /health while
# breaking calls to another box. Localhost-only is not assumed here.
IPAddressDeny=169.254.0.0/16
BindReadOnlyPaths=/home/mase/Projects/spot-price
MemoryMax=1G
