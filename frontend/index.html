<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pörssisähkö — mase.fi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.1.0/dist/chartjs-plugin-annotation.min.js" integrity="sha384-3N9GHhCtN3CQef6tNfqgZlv7sQLYIkcChN+uaTZ7xVdzKYp/SjBNPxa92+hM7EAY" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>Pörssisähkö</h1>
      <a href="/">← mase.fi</a>
    </header>

    <!-- Hero Card -->
    <div class="hero-card card" id="heroCard">
      <div class="hero-card__tint" id="heroTint"></div>
      <div class="hero-card__content">
        <div class="hero-card__label">Hinta nyt</div>
        <div id="heroPrice" class="hero-card__loading">Ladataan...</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="today" id="tabToday">Tänään</button>
      <button class="tab-btn" data-tab="tomorrow" id="tabTomorrow">Huomenna</button>
    </div>

    <!-- Chart Controls -->
    <div class="chart-controls">
      <div class="toggle-group" id="chartTypeToggle">
        <button class="toggle-btn active" data-value="area">Area</button>
        <button class="toggle-btn" data-value="bar">Bar</button>
      </div>
      <div class="toggle-group" id="resolutionToggle">
        <button class="toggle-btn active" data-value="15min">15 min</button>
        <button class="toggle-btn" data-value="hourly">Tunnit</button>
      </div>
    </div>

    <!-- Chart -->
    <div class="chart-container card" id="chartContainer">
      <div class="chart-placeholder" id="chartPlaceholder">Ladataan...</div>
      <canvas id="priceChart" style="display:none;"></canvas>
    </div>

    <!-- Insights -->
    <div class="insights" id="insightsGrid">
      <div class="insight-card card">
        <div class="insight-card__icon insight-card__icon--green">⚡</div>
        <div class="insight-card__title">Halvin 2h jakso</div>
        <div class="insight-card__value" id="insightCheapValue">—</div>
        <div class="insight-card__detail" id="insightCheapDetail">Ladataan...</div>
      </div>
      <div class="insight-card card">
        <div class="insight-card__icon insight-card__icon--amber">⏱</div>
        <div class="insight-card__title">Seuraava halpa hetki</div>
        <div class="insight-card__value" id="insightNextValue">—</div>
        <div class="insight-card__detail" id="insightNextDetail">Ladataan...</div>
      </div>
      <div class="insight-card card">
        <div class="insight-card__icon insight-card__icon--red">🔺</div>
        <div class="insight-card__title">Kalliimpaa, vältä</div>
        <div class="insight-card__value" id="insightPeakValue">—</div>
        <div class="insight-card__detail" id="insightPeakDetail">Ladataan...</div>
      </div>
    </div>

    <!-- Heatmap -->
    <div class="heatmap-section">
      <h2 class="section-title">Viikkokuvio <span id="heatmapWeekRange" style="color: var(--text-muted); font-size: 0.7em; font-weight: 400;"></span></h2>
      <div class="card" id="heatmapCard">
        <div class="heatmap-placeholder" id="heatmapPlaceholder">Ladataan...</div>
        <div class="heatmap-grid" id="heatmapGrid" style="display:none;"></div>
      </div>
    </div>
    <div class="heatmap-tooltip" id="heatmapTooltip"></div>

    <!-- Cost Estimator -->
    <div class="estimator-section">
      <h2 class="section-title">Ajoitusavustin</h2>
      <div class="device-chips" id="deviceChips"></div>
      <div class="estimator-inputs">
        <div class="estimator-field">
          <label for="inputPower">Teho (kW)</label>
          <input type="number" id="inputPower" min="0.1" step="0.1" placeholder="esim. 6">
        </div>
        <div class="estimator-field">
          <label for="inputDuration">Kesto (h)</label>
          <input type="number" id="inputDuration" min="0.25" step="0.25" placeholder="esim. 2">
        </div>
        <div class="estimator-field">
          <label for="inputDeadline">Valmis viimeistään</label>
          <input type="time" id="inputDeadline" placeholder="esim. 07:00">
        </div>
      </div>
      <div id="estimatorResults">
        <div class="estimator-no-data">Valitse laite tai syötä teho ja kesto</div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      Tiedot: spot-hinta.fi • Päivitetään 15 min välein
    </footer>
  </div>

  <script type="module">
    import { init } from './js/main.js';
    init();
  </script>
</body>
</html>
